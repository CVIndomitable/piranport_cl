plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // 让测试能加载 MC/Neoforge 类（Payload roundtrip、BlockEntity 测试等）
    testCompileClasspath.extendsFrom runtimeClasspath
    testRuntimeClasspath.extendsFrom testCompileClasspath
}

dependencies {
    // Patchouli — soft dependency, runtime only (reflection-based API in GuidebookItem)
    localRuntime "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"

    // JEI — soft dependency, compile-time API + runtime
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.27.0.340"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.27.0.340"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:19.27.0.340"

    // Touhou Little Maid — soft dependency for maid rigging compat (optional at runtime)
    compileOnly "maven.modrinth:touhou-little-maid:1.5.2-neoforge+mc1.21.1"
    localRuntime "maven.modrinth:touhou-little-maid:1.5.2-neoforge+mc1.21.1"

    // ArchUnit — 架构约束测试
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.0"
    testImplementation "com.tngtech.archunit:archunit-junit5:1.3.0"
    testImplementation "org.slf4j:slf4j-api:2.0.12"
    testImplementation "maven.modrinth:the-ponderer:YzFWxoks"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// 强制统一 slf4j 版本到 2.0.12，覆盖 neoforge 强加的 {strictly 2.0.9}。
// 2.0.12 与 2.0.9 在 API 层完全兼容，对运行时无影响。
configurations.testCompileClasspath {
    resolutionStrategy {
        force 'org.slf4j:slf4j-api:2.0.12'
    }
}
configurations.testRuntimeClasspath {
    resolutionStrategy {
        force 'org.slf4j:slf4j-api:2.0.12'
    }
}

var pondererPack = tasks.register('pondererPack', Zip) {
    from('ponderer') {
        include 'pack.json', 'pack.mcmeta', 'data/**'
    }
    destinationDirectory = layout.projectDirectory.dir('ponderer')
    archiveFileName = 'PiranPort-Ponderer-1.0.zip'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

var installPondererPack = tasks.register('installPondererPack', Copy) {
    from pondererPack
    into layout.projectDirectory.dir('run/resourcepacks')
    rename { '[Ponderer] Piran Port.zip' }
}

tasks.named('runClient').configure {
    dependsOn installPondererPack
}

tasks.named('assemble').configure {
    dependsOn pondererPack
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    dependsOn pondererPack
    inputs.files(pondererPack).withPropertyName('pondererTutorialPack')
    systemProperty 'piranport.pondererPack', pondererPack.get().archiveFile.get().asFile.absolutePath
    systemProperty 'piranport.pondererSource', layout.projectDirectory.dir('ponderer').asFile.absolutePath
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
